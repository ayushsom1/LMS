# Use all available CPU cores — on t3.large (2 vCPU) this doubles throughput vs default of 1
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # Rate limiting zones
    # Per-IP rate limits — generous burst for exam start rush
    limit_req_zone $binary_remote_addr zone=api:20m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=submit:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=run_code:10m rate=3r/s;

    # Return 429 (Too Many Requests) instead of 503 for rate-limited requests
    limit_req_status 429;
    limit_conn_status 429;

    # Upstream — Next.js app
    upstream nextjs {
        server app:3000;
        keepalive 64;
        keepalive_requests 1000;
        keepalive_timeout 65s;
    }

    # Proxy buffering — prevents large responses (submissions list) from buffering to disk
    proxy_buffer_size          16k;
    proxy_buffers              8 32k;
    proxy_busy_buffers_size    64k;

    # Proxy timeouts
    proxy_connect_timeout      10s;
    proxy_send_timeout         60s;

    server {
        listen 80;
        server_name _;

        # Redirect to HTTPS in production (uncomment when SSL is configured)
        # return 301 https://$host$request_uri;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

        # Client body size (for code submissions)
        client_max_body_size 5M;

        # Stricter rate limit on submit — per-IP, with delay (queue) instead of nodelay (reject)
        # burst=10 means up to 10 submit requests per IP can queue before 429
        location ~ /api/test/.+/submit {
            limit_req zone=submit burst=10 delay=5;
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # Rate limit code execution
        location /api/test/run {
            limit_req zone=run_code burst=10 delay=5;
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # API rate limiting — burst=200, delay=100 queues the rush instead of rejecting it
        # At exam start, 2000 students will queue briefly rather than getting 503
        location /api/test/ {
            limit_req zone=api burst=200 delay=100;
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 120s;
        }

        # Static assets caching
        location /_next/static {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }

        # Default proxy
        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Health check
        location /health {
            proxy_pass http://nextjs/api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}

